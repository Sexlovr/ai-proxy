<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<title>AI Proxy · Models</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f172a;--card:#1e293b;--line:#334155;--line2:#475569;
    --txt:#e2e8f0;--mut:#64748b;--blue:#60a5fa;--brand:#6366f1;--brand2:#4f46e5;
    --green:#22c55e;--orange:#f97316;--amber:#fbbf24;--red:#ef4444;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.4;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* ── header ───────────────────────────────────────────────────────── */
  header{
    background:linear-gradient(135deg,#1e40af,#7c3aed);
    padding:clamp(1.1rem,4vw,2.6rem) clamp(.9rem,3vw,2rem);
    text-align:center;
  }
  header h1{font-size:clamp(1.4rem,5vw,2.4rem);font-weight:800;letter-spacing:-.5px}
  header p{margin-top:.3rem;opacity:.85;font-size:clamp(.72rem,2.5vw,1.05rem)}

  .key-box{
    margin:1.2rem auto 0;max-width:600px;width:min(90%,600px);
    background:#ffffff15;border:1px solid #ffffff30;border-radius:12px;
    padding:clamp(.7rem,2vw,1rem) clamp(.9rem,2.5vw,1.5rem);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(.72rem,2.5vw,.92rem);word-break:break-all;text-align:left;
  }
  .key-row{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem}
  .key-row span{color:var(--amber);font-weight:700;flex:1;min-width:60px}
  .copy-btn{
    padding:.4rem .9rem;background:var(--brand);color:#fff;border:none;
    border-radius:8px;cursor:pointer;font-size:.78rem;min-height:40px;-webkit-appearance:none;
  }
  .copy-btn:hover{background:var(--brand2)}

  /* ── body grid ─────────────────────────────────────────────────────── */
  main{
    max-width:1180px;margin:1.6rem auto;padding:0 clamp(.7rem,3vw,1.5rem) 3rem;
  }
  .stats{text-align:center;color:var(--mut);font-size:clamp(.7rem,2vw,.9rem);margin-bottom:1rem}
  .search{position:relative;margin-bottom:1rem}
  .search input{
    width:100%;padding:.8rem 1rem .8rem 2.4rem;border-radius:10px;border:1px solid var(--line);
    background:#1e293b;color:var(--txt);font-size:1rem;outline:none;-webkit-appearance:none;
  }
  .search input:focus{border-color:var(--brand)}
  .search::before{content:"🔍";position:absolute;left:.85rem;top:50%;transform:translateY(-50%);opacity:.65;font-size:.9rem}

  h2{font-size:clamp(.85rem,2.5vw,1.1rem);margin:0 0 .8rem;color:var(--line2);text-transform:uppercase;letter-spacing:1.5px}
  .grid{
    display:grid;gap:clamp(.6rem,2vw,1.1rem);
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:clamp(.7rem,2vw,1.1rem);display:flex;flex-direction:column;gap:.6rem;
  }
  .card h3{
    font-size:clamp(.72rem,2.4vw,.86rem);color:var(--blue);font-family:ui-monospace,Menlo,Consolas,monospace;
    word-break:break-all;font-weight:600;
  }
  .badges{display:flex;flex-direction:column;gap:.4rem}
  .badge{
    padding:.45rem .7rem;border-radius:8px;font-size:clamp(.72rem,2.3vw,.82rem);font-weight:600;
    font-family:ui-monospace,Menlo,Consolas,monospace;cursor:pointer;line-height:1.45;min-height:36px;
    display:flex;align-items:center;justify-content:space-between;gap:.4rem;user-select:none;
    transition:transform .08s ease,filter .15s ease;
  }
  .badge:active{transform:scale(.97)}
  .badge small{font-weight:400;opacity:.8;font-size:clamp(.65rem,2vw,.74rem);word-break:break-all;text-align:right}
  .badge.split{padding:.5rem .7rem}

  .empty{color:var(--mut);font-size:.85rem;text-align:center;padding:2rem}
  .error{color:var(--red);text-align:center;padding:1.4rem}

  .toast{
    position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);
    background:var(--green);color:#fff;padding:.6rem 1.1rem;border-radius:10px;
    font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;
    max-width:90%;text-align:center;box-shadow:0 10px 30px #0008;
  }
  .toast.show{opacity:1}

  /* ── footer / admin link ──────────────────────────────────────────── */
  footer{text-align:center;padding:1.4rem 1rem;color:var(--mut);font-size:.82rem}
  footer strong{color:var(--line2)}
  footer code{color:var(--blue)}
  .admin-link{margin-top:1rem;display:inline-block}
  .admin-link a{
    color:var(--line2);text-decoration:none;font-size:.78rem;padding:.45rem .8rem;
    border:1px solid var(--line);border-radius:8px;transition:all .2s;
    min-height:40px;display:inline-flex;align-items:center;
  }
  .admin-link a:hover,.admin-link a:active{color:var(--txt);border-color:var(--brand);background:#1e293b}

  /* ── phone-tight layout ───────────────────────────────────────────── */
  @media (max-width:520px){
    .grid{grid-template-columns:1fr;gap:.7rem}
    .card{padding:.7rem}
    .card h3{font-size:.78rem}
  }
  @media (max-width:380px){
    header{padding:1rem .7rem}
    main{padding:0 .6rem 2.5rem}
  }
</style>
</head>
<body>
<header>
  <h1>🚀 Free AI Proxy</h1>
  <p>OpenAI-compatible · SillyTavern · JanitorAI · any OpenAI client</p>
  <div class="key-box">
    <div class="key-row">
      <span style="color:var(--mut);flex:0 0 auto;margin-right:.3rem">Base URL</span>
      <span id="base-url">…</span>
      <button class="copy-btn" onclick="copyText(window.BASE_URL, 'Base URL copied')">Copy</button>
    </div>
    <div class="key-row" style="margin-top:.5rem">
      <span style="color:var(--mut);flex:0 0 auto;margin-right:.3rem">API Key</span>
      <span id="kv">…</span>
      <button class="copy-btn" onclick="copyKey()">Copy</button>
    </div>
  </div>
</header>

<main>
  <div class="stats" id="stats">Loading models…</div>
  <div class="search"><input type="text" id="q" placeholder="Filter models…" oninput="filter()" disabled></div>
  <h2>Available Models</h2>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div>Set your client's <strong>Base URL</strong> to <strong id="footer-url">…</strong> and <strong>API Key</strong> to your proxy key.</div>
  <div class="admin-link"><a href="/admin">⚙️ Admin Login</a></div>
</footer>

<div class="toast" id="toast"></div>

<script>
let PROXY_KEY = "…";
window.BASE_URL = window.location.origin + "/v1";
document.getElementById("base-url").textContent  = window.BASE_URL;
document.getElementById("footer-url").textContent = window.BASE_URL;

fetch("/api/info")
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    PROXY_KEY = d.proxy_key;
    document.getElementById("kv").textContent = PROXY_KEY;
  })
  .catch(() => {
    document.getElementById("kv").textContent = "(locked — enter proxy key in /v1)";
    // If gate blocked /api/info we offer a login prompt.
    if (!window.location.search.includes("nogate")) {
      // try navigating to gate just once.
    }
  });

async function loadModels() {
  const grid = document.getElementById("grid");
  try {
    const res = await fetch("/v1/models");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const models = (data && Array.isArray(data.data)) ? data.data.map(m => m.id).sort() : [];
    if (!models.length) {
      document.getElementById("stats").textContent = "No models configured yet. Add them in the Admin panel.";
      grid.innerHTML = '<p class="empty">Visit <a href="/admin">/admin</a> → Mappings or Model Groups to wire up models.</p>';
      return;
    }
    const groups = {};
    for (const id of models) {
      // family = string before the first "-…stream" tag if present, else first dash segment.
      const family = id.replace(/-(true|fake)-stream/gi, "").replace(/-search-\d+/g, '');
      const bucket = family.split("-")[0] || family;
      (groups[bucket] = groups[bucket] || []).push(id);
    }
    document.getElementById("stats").textContent =
      models.length + " models · " + Object.keys(groups).length + " families · tap any badge to copy its model ID";
    document.getElementById("q").disabled = false;

    grid.innerHTML = Object.entries(groups).map(([family, ids]) => {
      const badges = ids.map(id => {
        const isTrue   = /-true-stream/i.test(id);
        const isSearch = /-search-/.test(id);
        const label    = isTrue ? "✅ true-stream" : (id.includes("-fake-stream") ? "🔄 fake-stream" : id);
        const srch     = isSearch ? " 🔍" : "";
        const color    = isTrue ? "var(--green)" : (id.includes("-fake-stream") ? "var(--orange)" : "var(--blue)");
        const safe     = String(id).replace(/[`"<>]/g, " ").trim();
        return '<div class="badge" style="background:'+color+'1f;color:'+color+';border:1px solid '+color+'55"'
             + ' onclick="copyText(\''+safe.replace(/'/g,"&#39;")+'\', \'Copied model ID\')">'
             + '<span>'+label+srch+'</span><small>'+safe+'</small></div>';
      }).join("");
      return '<div class="card" data-search="'+ ids.join(" ") +' '+family+'"><h3>'+family+'</h3>'
           + '<div class="badges">'+badges+'</div></div>';
    }).join("");
  } catch (e) {
    grid.innerHTML = '<p class="error">Failed to load models: '+e.message+'</p>';
    document.getElementById("stats").textContent = "";
  }
}

function filter() {
  const q = document.getElementById("q").value.toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = c.dataset.search.toLowerCase().includes(q) ? "" : "none";
  });
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window.__t); window.__t = setTimeout(() => t.classList.remove("show"), 1700);
}
function copyText(str, msg){
  if(!str) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(()=>showToast(msg||"Copied")).catch(()=>showToast("Copy failed"));
  } else {
    const el=document.createElement("textarea"); el.value=str; document.body.appendChild(el);
    el.select(); try{document.execCommand("copy"); showToast(msg||"Copied");}catch(_){showToast("Copy failed")} el.remove();
  }
}
function copyKey(){ copyText(PROXY_KEY, "API key copied"); }
loadModels();
</script>
</body>
</html>
