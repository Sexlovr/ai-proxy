<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Access Required</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0f1e;--card:#111827;--line:#1e2d45;--txt:#e2e8f0;--mut:#64748b;--ac:#6366f1;--ac2:#4f46e5;--err:#ef4444}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%,#15213b 0,var(--bg) 70%);
    color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:2.2rem 1.8rem;max-width:400px;width:calc(100% - 2rem);text-align:center;
    box-shadow:0 25px 60px #00000050;
  }
  .icon{font-size:2.6rem;margin-bottom:1rem}
  h1{font-size:1.25rem;font-weight:700;margin-bottom:.45rem;line-height:1.25}
  p{color:var(--mut);font-size:.86rem;margin-bottom:1.6rem;line-height:1.4}
  form{display:flex;flex-direction:column;gap:.6rem}
  input{
    width:100%;padding:.85rem 1rem;background:#1e293b;border:1px solid #2d3f58;
    border-radius:10px;color:var(--txt);font-size:1rem;outline:none;
    text-align:center;letter-spacing:1px;transition:border-color .2s;-webkit-appearance:none;
  }
  input:focus{border-color:var(--ac)}
  button{
    width:100%;padding:.85rem;background:var(--ac);color:#fff;border:none;
    border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:background .15s;
  }
  button:hover{background:var(--ac2)}
  button:disabled{opacity:.6;cursor:not-allowed}
  .error{color:var(--err);font-size:.83rem;margin-top:.2rem;min-height:1rem;display:none}
  .hint{margin-top:1rem;font-size:.72rem;color:var(--mut);opacity:.7}
  @media (max-width:480px){ .card{padding:1.6rem 1.2rem;border-radius:14px}.icon{font-size:2.2rem}h1{font-size:1.1rem} }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔐</div>
    <h1>AI Proxy · Access Required</h1>
    <p>This proxy is protected. Enter the proxy key to view the model UI.</p>
    <form onsubmit="return unlock(event)">
      <input type="password" id="pw" placeholder="••••••••••" autocomplete="current-password" autofocus required>
      <button type="submit" id="btn">Unlock</button>
      <div class="error" id="err"></div>
    </form>
    <div class="hint">Need to call the API directly? Send <code>Authorization: Bearer <proxy-key></code> against <code>/v1/*</code>.</div>
  </div>
<script>
async function unlock(e){
  e.preventDefault();
  const pw=document.getElementById("pw").value;
  const btn=document.getElementById("btn");
  const err=document.getElementById("err");
  btn.disabled=true; btn.textContent="Checking…"; err.style.display="none"; err.textContent="";
  try{
    const r=await fetch("/_unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
    if(r.ok){ location.replace("/"); return false; }
    let m="Incorrect proxy key. Try again.";
    try{const j=await r.json(); if(j.error)m=j.error;}catch(_){}
    err.textContent=m; err.style.display="block"; btn.disabled=false; btn.textContent="Unlock";
  }catch(_){ err.textContent="Network error — please retry."; err.style.display="block"; btn.disabled=false; btn.textContent="Unlock"; }
  return false;
}
</script>
</body>
</html>
